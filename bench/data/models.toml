# Model catalog. One table per size class.
#
# S, M, L, F are listed here. XL is chosen dynamically from `plan` and cannot be
# downloaded in version 1: it only works with `--gguf XL=<path>` (llama.cpp).
#
# Keys per class:
#   ollama_tag         tag in the Ollama library (and in the mirror's Ollama store)
#   quant              quantisation of the Ollama model layer (file_type of its GGUF)
#   size_bytes         size of the Ollama model layer in bytes
#   reuse_ollama_blob  llama.cpp may load the GGUF blob of the Ollama model directly
#   ollama_pull        false: the tag is not in the Ollama library, it only comes from a
#                      mirror or an existing local store (default true)
#   [<class>.gguf]     a separate GGUF file for llama.cpp (pinned revision and sha256),
#                      with its own quant: it can differ from the Ollama layer
#       mirror_path    location below <mirror>/gguf

[S]
ollama_tag = "qwen3.5:4b"
quant = "Q4_K_M"
size_bytes = 2648593216
reuse_ollama_blob = true

[M]
ollama_tag = "qwen3:14b"
quant = "Q4_K_M"
size_bytes = 9276184896
reuse_ollama_blob = true

[L]
ollama_tag = "qwen3.8:27b"
quant = "Q4_K_M"
size_bytes = 16810714464
reuse_ollama_blob = true

# F: the library tag flint:40b is NVFP4, and Ollama offers no Q4_K_M. So that both engines
# run the same weights, Ollama uses a local tag built from the pinned Hugging Face file
# below. Its model layer IS that file (same sha256). Built with Ollama 0.40.13:
#   ollama create flint-bench:40b-q4_K_M -f Modelfile
# Modelfile (renderer, parser and parameters copied from the library flint:40b manifest):
#   FROM ./Flint-Q4_K_M.gguf
#   TEMPLATE {{ .Prompt }}
#   RENDERER flint
#   PARSER flint
#   PARAMETER temperature 1
#   PARAMETER top_k 20
#   PARAMETER top_p 0.95
[F]
ollama_tag = "flint-bench:40b-q4_K_M"
quant = "Q4_K_M"
size_bytes = 23387911136
reuse_ollama_blob = true
ollama_pull = false

[F.gguf]
quant = "Q4_K_M"
repo = "ggml-org/Flint-GGUF"
file = "Flint-Q4_K_M.gguf"
revision = "468307a1b38259e9e4c9d4fe53d4e3b76386572c"
sha256 = "c3c4d93f9db92627a2fc47ea8fe8c64a094cabd3549db544bcdd2c00e9a9a347"
size_bytes = 23387911136
mirror_path = "flint/Flint-Q4_K_M.gguf"
