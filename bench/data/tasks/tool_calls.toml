category = "tool_calls"
messages = [{role = "user", content = "What time is it in Tokyo?"}]
tools = [{type = "function", function = {name = "search_web", description = "Search the web for pages about a query.", parameters = {type = "object", properties = {query = {type = "string"}}, required = ["query"]}}}, {type = "function", function = {name = "get_time", description = "Get the current local time in a time zone.", parameters = {type = "object", properties = {timezone = {type = "string", enum = ["UTC", "Asia/Tokyo", "America/New_York"]}}, required = ["timezone"]}}}]

[task.sampling]
temperature = 0.0
top_p = 1.0
max_tokens = 256

[task.check]
type = "tool_call"
name = "get_time"
args = {timezone = "Asia/Tokyo"}

