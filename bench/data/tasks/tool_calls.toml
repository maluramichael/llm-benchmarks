[[task]]
id = "tool-1"
category = "tool_calls"
messages = [{role = "user", content = "What is the weather like in Berlin right now?"}]
tools = [{type = "function", function = {name = "get_weather", description = "Get the current weather for a city.", parameters = {type = "object", properties = {city = {type = "string", description = "City name"}}, required = ["city"]}}}]

[task.sampling]
temperature = 0.0
top_p = 1.0
max_tokens = 256

[task.check]
type = "tool_call"
name = "get_weather"
args = {city = "Berlin"}

[[task]]
id = "tool-2"
category = "tool_calls"
messages = [{role = "user", content = "Convert 250 euros to US dollars."}]
tools = [{type = "function", function = {name = "convert_currency", description = "Convert an amount of money between currencies.", parameters = {type = "object", properties = {amount = {type = "number"}, from_currency = {type = "string", enum = ["EUR", "USD", "GBP"]}, to_currency = {type = "string", enum = ["EUR", "USD", "GBP"]}}, required = ["amount", "from_currency", "to_currency"]}}}]

[task.sampling]
temperature = 0.0
top_p = 1.0
max_tokens = 256

[task.check]
type = "tool_call"
name = "convert_currency"
args = {amount = 250, from_currency = "EUR", to_currency = "USD"}

[[task]]
