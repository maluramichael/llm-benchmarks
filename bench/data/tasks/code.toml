[[task]]
id = "code-1"
category = "code"
messages = [{role = "user", content = "Write a Python function is_palindrome(s) that returns True if the string s reads the same forwards and backwards when case and all non-alphanumeric characters are ignored, and False otherwise. An empty string is a palindrome. Reply with a single Python code block containing only the function and any imports it needs."}]

[task.sampling]
temperature = 0.2
top_p = 0.95
max_tokens = 1024

[task.check]
type = "code"
tests = '''
assert is_palindrome("A man, a plan, a canal: Panama") is True
assert is_palindrome("race a car") is False
assert is_palindrome("") is True
assert is_palindrome("No 'x' in Nixon") is True
assert is_palindrome("ab") is False
'''

