[[task]]
id = "code-4"
category = "code"
messages = [{role = "user", content = "Write a Python function merge_intervals(intervals) that takes a list of [start, end] lists of integers (start <= end, any order) and returns a new list of merged [start, end] lists sorted by start. Intervals that touch (for example [1, 3] and [3, 5]) are merged. Reply with a single Python code block containing only the function and any imports it needs."}]

[task.sampling]
temperature = 0.2
top_p = 0.95
max_tokens = 1024

[task.check]
type = "code"
tests = '''
assert merge_intervals([[1, 3], [2, 6], [8, 10], [15, 18]]) == [[1, 6], [8, 10], [15, 18]]
assert merge_intervals([[1, 3], [3, 5]]) == [[1, 5]]
assert merge_intervals([]) == []
assert merge_intervals([[5, 6], [1, 2]]) == [[1, 2], [5, 6]]
assert merge_intervals([[1, 10], [2, 3]]) == [[1, 10]]
'''

