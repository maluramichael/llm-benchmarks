[[task]]
id = "json-1"
category = "json"
messages = [{role = "user", content = "Extract the person from this text and answer with a JSON object only. Text: Maria Gomez, 34, works as a veterinarian in Lisbon."}]
json_schema = {type = "object", properties = {name = {type = "string"}, age = {type = "integer"}, city = {type = "string"}, profession = {type = "string"}}, required = ["name", "age", "city", "profession"]}

[task.sampling]
temperature = 0.0
top_p = 1.0
max_tokens = 512

[task.check]
type = "json"
expect = {name = "Maria Gomez", age = 34, city = "Lisbon", profession = "veterinarian"}

[[task]]
id = "json-2"
category = "json"
messages = [{role = "user", content = "Turn this order into a JSON object with an items array. Order: 2 apples at 0.5 each and 3 pears at 0.75 each. Answer with a JSON object only."}]
json_schema = {type = "object", properties = {items = {type = "array", items = {type = "object", properties = {name = {type = "string"}, quantity = {type = "integer", minimum = 1}, unit_price = {type = "number", minimum = 0}}, required = ["name", "quantity", "unit_price"]}}}, required = ["items"]}

[task.sampling]
temperature = 0.0
top_p = 1.0
max_tokens = 512

[task.check]
type = "json"
expect = {"items.0.quantity" = 2, "items.0.unit_price" = 0.5, "items.1.quantity" = 3, "items.1.unit_price" = 0.75}

[[task]]
id = "json-3"
category = "json"
messages = [{role = "user", content = "Classify the sentiment of this product review and give a confidence between 0 and 1. Answer with a JSON object only. Review: The battery died after two days and support never answered my emails. Terrible."}]
json_schema = {type = "object", properties = {sentiment = {type = "string", enum = ["positive", "negative", "neutral"]}, confidence = {type = "number", minimum = 0, maximum = 1}}, required = ["sentiment", "confidence"]}

[task.sampling]
temperature = 0.0
top_p = 1.0
max_tokens = 512

[task.check]
type = "json"
expect = {sentiment = "negative"}

[[task]]
id = "json-4"
category = "json"
messages = [{role = "user", content = "Extract the event details as a JSON object only. Give the room as its code only, without the word Room. Text: The workshop takes place on 2027-03-14 from 09:00 to 11:30 in Room B2."}]
json_schema = {type = "object", properties = {date = {type = "string"}, start = {type = "string"}, end = {type = "string"}, room = {type = "string"}}, required = ["date", "start", "end", "room"]}

[task.sampling]
temperature = 0.0
top_p = 1.0
max_tokens = 512

[task.check]
type = "json"
expect = {date = "2027-03-14", start = "09:00", end = "11:30", room = "B2"}

[[task]]
id = "json-5"
category = "json"
messages = [{role = "user", content = "List every email address in this text in the order they appear, as a JSON object with an emails array. Answer with a JSON object only. Text: Write to a.smith@example.com or b.jones@example.org; cc c.lee@example.net for billing."}]
json_schema = {type = "object", properties = {emails = {type = "array", items = {type = "string"}}}, required = ["emails"]}

[task.sampling]
temperature = 0.0
top_p = 1.0
max_tokens = 512

[task.check]
type = "json"
expect = {emails = ["a.smith@example.com", "b.jones@example.org", "c.lee@example.net"]}
