name: Build README and charts

on:
  push:
    branches: [master]
    paths:
      - "bench/**"
      - "tests/**"
      - "scripts/**"
      - "runs/**"
      - "README.md"
  pull_request:
    paths:
      - "bench/**"
      - "tests/**"
      - "scripts/**"
      - "runs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python3 -W error::ResourceWarning -m unittest discover -s tests

      # On pull requests this only proves that the new run files parse.
      # Contributors do not need to regenerate anything, master does it after the merge.
      - name: Generate README charts and run list
        run: |
          python3 scripts/build.py
          git diff --stat

      - name: Commit changes
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md charts/
          git commit -m "Update README charts"
          git push
