name: Benchmark run
description: Send results without a pull request. They get added as a run file.
title: "Run: <device>"
body:
  - type: markdown
    attributes:
      value: |
        Run the [benchmark prompt](https://github.com/maluramichael/llm-benchmarks#benchmark-prompt) on your machine, then paste the report here. The format is described in [CONTRIBUTING.md](https://github.com/maluramichael/llm-benchmarks/blob/master/CONTRIBUTING.md).
  - type: input
    id: device
    attributes:
      label: Device
      description: "Pattern: <device type> <chip or GPU> <memory>"
      placeholder: PC RTX 5080 16 GB
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: results.md
      description: Content of ~/llm-benchmark/<date>/results.md
      render: markdown
    validations:
      required: true
  - type: textarea
    id: deviations
    attributes:
      label: Deviations from the standard run
      description: Not restarted, programs left open, monitor on the GPU, other quantization, custom engine build. Leave empty if there are none.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and license
      options:
        - label: The report contains no names, host names, IP addresses, user paths or serial numbers.
          required: true
        - label: I agree that the results are published under CC BY 4.0, like the rest of this repository.
          required: true
