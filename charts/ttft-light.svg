<svg xmlns="http://www.w3.org/2000/svg" width="960" height="376" viewBox="0 0 960 376" role="img" aria-label="Time to first token in seconds per device, model class and engine">
<style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .title { font-size: 20px; font-weight: 600; fill: #1f2328; }
    .section { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .panel { font-size: 13px; font-weight: 600; fill: #1f2328; }
