    .sub { font-size: 13px; }
    .legend { font-size: 12px; fill: #1f2328; }
    .value { font-size: 11px; font-variant-numeric: tabular-nums; }
    .tick { font-size: 10px; fill: #818b98; font-variant-numeric: tabular-nums; }
    .muted, .note, .foot { fill: #818b98; }
    .note { font-size: 11px; }
    .foot { font-size: 11px; }
    .cell { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .limitlabel { font-size: 10px; fill: #818b98; }
    .grid { stroke: #eaeef2; stroke-width: 1; }
    .row { stroke: #eaeef2; stroke-width: 1; }
    .base { stroke: #c8d1da; stroke-width: 1; }
    .limit { stroke: #b0bac5; stroke-width: 1; stroke-dasharray: 2 3; }
    .gapbox { fill: none; stroke: #818b98; stroke-width: 1; stroke-dasharray: 3 2; }
    </style>
