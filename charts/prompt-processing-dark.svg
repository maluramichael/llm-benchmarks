<svg xmlns="http://www.w3.org/2000/svg" width="960" height="292" viewBox="0 0 960 292" role="img" aria-label="Prompt processing speed in tokens per second per device, model class and engine">
<style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9198a1; }
    .title { font-size: 20px; font-weight: 600; fill: #f0f6fc; }
    .section { font-size: 15px; font-weight: 600; fill: #f0f6fc; }
    .panel { font-size: 13px; font-weight: 600; fill: #f0f6fc; }
    .device { font-size: 13px; fill: #f0f6fc; }
    .sub { font-size: 13px; }
    .legend { font-size: 12px; fill: #f0f6fc; }
    .value { font-size: 11px; font-variant-numeric: tabular-nums; }
    .tick { font-size: 10px; fill: #6e7681; font-variant-numeric: tabular-nums; }
    .muted, .note, .foot { fill: #6e7681; }
    .note { font-size: 11px; }
    .foot { font-size: 11px; }
    .cell { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .limitlabel { font-size: 10px; fill: #6e7681; }
    .grid { stroke: #1d232b; stroke-width: 1; }
    .row { stroke: #1d232b; stroke-width: 1; }
    .base { stroke: #3d444d; stroke-width: 1; }
    .limit { stroke: #4d5560; stroke-width: 1; stroke-dasharray: 2 3; }
    .gapbox { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 3 2; }
    </style>
